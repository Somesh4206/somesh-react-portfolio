  <style>
    :root{

      --accent:#8C5A2B; --accent-deep:#5F3B1A; --accent-soft:#EADBC3;

      --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',sans-serif; --mono:'Space Mono',monospace; --disp:'Bebas Neue',sans-serif;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden}

    ::selection{background:var(--accent);color:#fff}
    a{color:var(--accent-deep)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 3.5rem;background:rgba(250,246,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .logo{font-family:var(--disp);font-size:1.5rem;letter-spacing:.15em;color:var(--ink);text-decoration:none}
    .logo em{font-style:normal;color:var(--accent)}
    .nav-links{display:flex;gap:1.8rem;list-style:none}
    .nav-links a{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;position:relative}
    .nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--accent);transition:width .3s}
    .nav-links a:hover,.nav-links a.active{color:var(--accent-deep)}
    .nav-links a:hover::after,.nav-links a.active::after{width:100%}
    section{min-height:0;position:relative}
    /* HERO */

    .hero-name span{color:var(--accent)}
    .hero-sub{font-family:var(--serif);font-size:1.25rem;font-style:italic;color:var(--ink2);margin-top:.9rem;animation:fadeUp .9s .6s ease both}

    .btn-outline{padding:.8rem 1.9rem;background:transparent;color:var(--accent-deep);font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid var(--accent);border-radius:4px;transition:all .25s;display:inline-block;cursor:pointer}

    .photo-corner{position:absolute;top:-12px;left:-12px;width:44px;height:44px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
    .download-cv-btn{position:absolute;top:-18px;left:-14px;z-index:3;padding:.65rem 1.1rem;background:var(--accent);color:#fff;font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-radius:3px;display:flex;align-items:center;gap:.5rem;box-shadow:0 8px 20px rgba(140,90,43,.35)}

    @keyframes scrollPulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
    /* MARQUEE */
    .marquee-wrap{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.9rem 0;background:var(--surface)}

    .about-stats{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2rem}

    .stat-card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .stat-number{font-family:var(--disp);font-size:2.4rem;color:var(--accent-deep);line-height:1}
    .stat-label{font-size:.75rem;color:var(--muted);margin-top:.3rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}

    /* SKILLS */
    .skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}

    .btn-ghost:hover{border-color:var(--accent);color:var(--accent-deep)}
    .projects-note{margin-top:1.6rem;font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em;line-height:1.8}
    .projects-note a{color:var(--accent-deep)}
    /* CASE STUDY VIEW */
    .case-wrap{max-width:920px;margin:0 auto;padding:7.5rem 1.5rem 4rem;position:relative;z-index:2}

    /* CONTACT */
    #contact{background:var(--surface);border-top:1px solid var(--line)}
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:4.5rem;align-items:start}
    .contact-tagline{font-family:var(--disp);font-size:clamp(2rem,4vw,3.2rem);line-height:1.05;margin-bottom:1.2rem}
    .contact-tagline span{color:var(--accent)}
    .contact-text{font-size:.95rem;color:var(--muted);line-height:1.8;margin-bottom:1.8rem}
    .contact-links{display:flex;flex-direction:column;gap:.8rem}
    .contact-link{display:flex;align-items:center;gap:.9rem;font-family:var(--mono);font-size:.78rem;color:var(--ink);text-decoration:none;padding:.95rem 1.3rem;border:1px solid var(--line);background:var(--bg);border-radius:6px;transition:all .25s}
    .contact-link:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateX(5px)}
    .contact-form{display:flex;flex-direction:column;gap:.9rem}
    .form-field{display:flex;flex-direction:column;gap:.35rem}
    .form-field label{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    .form-field input,.form-field textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:.93rem;padding:.85rem 1.1rem;outline:none;border-radius:6px;resize:vertical}
    .form-field input:focus,.form-field textarea:focus{border-color:var(--accent)}
    .form-field textarea{min-height:110px}
    footer{border-top:1px solid var(--line);padding:1.6rem 3.5rem;display:flex;justify-content:space-between;align-items:center;background:var(--surface);gap:1rem;flex-wrap:wrap}
    .footer-copy{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
    .footer-logo{font-family:var(--disp);font-size:1.15rem;letter-spacing:.15em;color:var(--accent)}
    .reveal{opacity:0;transform:translateY(34px);transition:opacity .7s ease,transform .7s ease}
    .reveal.visible{opacity:1;transform:translateY(0)}
    @media (max-width:960px){
      nav{padding:1rem 1.4rem}.nav-links{gap:1rem;flex-wrap:wrap}
      #hero{padding:7.5rem 1.4rem 4rem}.hero-grid{grid-template-columns:1fr;gap:2.6rem}
      .section-inner{padding:4.5rem 1.4rem}
      .about-grid,.contact-grid{grid-template-columns:1fr;gap:2.6rem}

      .certs-grid{grid-template-columns:1fr}.photo-frame{width:260px;height:320px}

      .stack{grid-template-columns:1fr}.stack dt{border-bottom:none;padding-bottom:0}
      .related-grid{grid-template-columns:1fr}
      footer{padding:1.4rem}
    }
    @media (max-width:600px){.skills-grid{grid-template-columns:1fr}}
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
      html{scroll-behavior:auto}.reveal{opacity:1;transform:none}
      .marquee{animation:none;flex-wrap:wrap;width:auto}
    }

    function useHash(){
      const [h,setH]=useState(window.location.hash||'#/');
      useEffect(()=>{
        const fn=()=>{ setH(window.location.hash||'#/'); window.scrollTo(0,0); };
        window.addEventListener('hashchange',fn); return ()=>window.removeEventListener('hashchange',fn);
      },[]);
      return h;

    function useReveal(dep){
      useEffect(()=>{
        const obs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); }),{threshold:.12});
        const attach=()=>document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
        attach(); const t=setTimeout(attach,600);
        return ()=>{clearTimeout(t); obs.disconnect();};
      },[dep]);
    }
    function useTyping(ref){
      useEffect(()=>{
        const roles=['AI/ML Engineer','Full-Stack Developer','Case-Study Builder','ML Research Tinkerer','Problem Solver'];
        let ri=0,ci=0,del=false,t; const base='B.Tech CSBS — ';
        const type=()=>{ const cur=roles[ri];
          if(!del){ if(ref.current) ref.current.textContent=base+cur.slice(0,ci+1); ci++; if(ci===cur.length){del=true; t=setTimeout(type,1700); return;} }
          else{ if(ref.current) ref.current.textContent=base+cur.slice(0,ci-1); ci--; if(ci===0){del=false; ri=(ri+1)%roles.length;} }
          t=setTimeout(type,del?45:75); };
        const s=setTimeout(type,1500); return ()=>{clearTimeout(s);clearTimeout(t);};
      },[]);
    }

        <p className="hero-role" ref={roleRef}>B.Tech CSBS — AI/ML Engineer</p>
        <div className="hero-cta"><a href="#projects" className="btn-primary" onClick={e=>{e.preventDefault(); window.location.hash='#/'; setTimeout(()=>scrollTo('projects'),60);}}>View Case Studies</a>
        <a href="#contact" className="btn-outline" onClick={e=>{e.preventDefault(); window.location.hash='#/'; setTimeout(()=>scrollTo('contact'),60);}}>Let&apos;s Talk</a></div></div>
        <div className="hero-photo-wrap"><div className="photo-frame"><a href="Somesh-Resume.pdf" onClick={dl} className="download-cv-btn" aria-label="Download CV"><span>⬇</span><span>Download CV</span></a>
          <div className="photo-inner"><img src="profile.png" alt="Portrait of Somesh M, AI/ML Engineer" className="avatar-img"/></div>
          <div className="photo-corner"/><div className="photo-tag">Open to Opportunities</div></div></div></div>
        <div className="scroll-hint" aria-hidden="true"><span>Scroll</span><div className="scroll-line"/></div></section>);
    }
    function Marquee(){ return (<div className="marquee-wrap" aria-hidden="true"><div className="marquee">{MARQUEE_ITEMS.map((m,i)=>(<React.Fragment key={i}><span>{m}</span><span className="accent">✦</span></React.Fragment>))}</div></div>); }
    function About(){ return (<section id="about"><div className="section-inner"><div className="about-grid"><div>
      <p className="section-label reveal">About Me</p><h2 className="section-title reveal">Turning <span style={{color:'var(--accent)'}}>Ideas</span><br/>Into Systems</h2>
      <div className="about-stats">{[{n:'3',l:'Internships'},{n:'6',l:'Case Studies'},{n:'10+',l:'Certifications'},{n:'7.67',l:'CGPA'}].map(s=>(<div key={s.l} className="stat-card reveal"><div className="stat-number">{s.n}</div><div className="stat-label">{s.l}</div></div>))}</div></div>
      <div className="about-text reveal"><p>Hey! I&apos;m <strong>Somesh M</strong> — an AI/ML engineer and B.Tech CSBS student at VSB Engineering College, Karur. I build intelligent systems end to end: data and modelling, APIs and databases, and the interfaces people actually touch.</p>
      <p>This portfolio is organised as <strong>engineering case studies</strong>: every project explains the problem, the solution, the step-by-step workflow, the architecture, the verified tech stack, the challenges and the outcome — so a recruiter gets the story and an interviewer gets the depth.</p>
      <p>Everything below is grounded in the actual repositories — no invented features, no fake screenshots, no inflated metrics.</p>
      <div className="tech-stack">{['Java','Python','Spring Boot','React','Flutter','Gemini','Firebase','scikit-learn','SQL','Git'].map(t=>(<span key={t} className="tech-tag">{t}</span>))}</div></div></div></div></section>); }
    function Skills(){ return (<section id="skills"><div className="section-inner"><p className="section-label reveal">What I Do</p>
      <h2 className="section-title reveal">Core <span style={{color:'var(--accent)'}}>Skills</span></h2>
      <p className="section-lede reveal">Generalist with depth in applied AI — comfortable from EDA to deployment.</p>
      <div className="skills-grid">{SKILLS.map((s,i)=>(<div key={s.name} className="skill-card reveal"><div className="skill-icon" aria-hidden="true">{s.icon}</div><div className="skill-name">{s.name}</div><div className="skill-desc">{s.desc}</div></div>))}</div></div></section>); }
    function Work(){ return (<section id="internships"><div className="section-inner"><p className="section-label reveal">Experience</p>
      <h2 className="section-title reveal">Internship <span style={{color:'var(--accent)'}}>Experience</span></h2>
      <div style={{marginBottom:'3rem'}}>{INTERNSHIPS.map(it=>(<div key={it.company+it.role} className="internship-item reveal"><div className="internship-role">{it.role}</div><div className="internship-company">{it.company}</div><div className="internship-desc">{it.desc}</div></div>))}</div>
      <p className="section-label reveal">Credentials</p><h2 className="section-title reveal" style={{marginBottom:'1.6rem'}}>Certifi<span style={{color:'var(--accent)'}}>cations</span></h2>
      <div className="certs-grid">{CERTIFICATIONS.map(c=>(<div key={c.name} className="cert-item reveal"><div aria-hidden="true">{c.icon}</div><div className="cert-name">{c.name}</div></div>))}</div></div></section>); }

    function PCard({p}){
      const open=e=>{ e.preventDefault(); window.location.hash='#/projects/'+p.slug; };
      return (<article className="pcard reveal">
        <a href={'projects/'+p.slug+'/'} onClick={open} aria-label={'Open case study: '+p.title} style={{textDecoration:'none',color:'inherit'}}>
          <div className="pcard-visual" style={{background:'linear-gradient(160deg, var(--surface) 0%, '+p.accent+'14 60%, '+p.accent+'26 100%)'}}>
            <span className="pnum" aria-hidden="true">{p.num}</span><span className="pcat">{p.category}</span>
            <h3>{p.title.toUpperCase()}</h3><p className="ptag">{p.tagline}</p></div></a>
        <div className="pcard-body"><p className="pcard-desc">{p.desc}</p>
          <div className="pcard-tech" aria-label="Key technologies">{p.tech.map(t=>(<span key={t}>{t}</span>))}</div>
          <div className="pcard-actions"><a className="btn-case" href={'projects/'+p.slug+'/'} onClick={open}>View Case Study →</a>
            <a className="btn-ghost" href={p.github} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}>GitHub</a>
            {p.demo && <a className="btn-ghost" href={p.demo} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}>Live Demo</a>}</div></div></article>);
    }
    function Projects(){ return (<section id="projects"><div className="section-inner"><p className="section-label reveal">Selected Work</p>
      <h2 className="section-title reveal">Project <span style={{color:'var(--accent)'}}>Case Studies</span></h2>
      <p className="section-lede reveal">Six builds, six deep dives — problem → solution → workflow → architecture → result. Grounded in the real repos.</p>
      <div className="projects-grid">{PROJECTS.map(p=>(<PCard key={p.slug} p={p}/>))}</div>
      <p className="projects-note reveal">Note on sources: SkillVision AI&apos;s live build is <a href="https://github.com/Somesh4206/SkillVision" target="_blank" rel="noreferrer">Somesh4206/SkillVision</a> (the similar <em>SkillVision-AI</em> URL returns 404). All features above were verified from cloned repositories, September 2026.</p></div></section>); }

    function Contact(){
      const [form,setForm]=useState({name:'',email:'',message:''}); const [sent,setSent]=useState(false);
      const submit=()=>{ if(form.name&&form.email&&form.message){ setSent(true); setTimeout(()=>setSent(false),4000); setForm({name:'',email:'',message:''}); } };
      return (<section id="contact"><div className="section-inner"><div className="contact-grid"><div>
        <p className="section-label reveal">Get In Touch</p>
        <h2 className="contact-tagline reveal">Let&apos;s Build<br/><span>Something</span><br/>Rigorous.</h2>
        <p className="contact-text reveal">Open to internships, full-time roles and collaborative builds. Ask me about any case study — I can walk through the architecture.</p>
        <div className="contact-links reveal">
          <a href="mailto:someshm7662@gmail.com" className="contact-link"><span aria-hidden="true">✉</span> someshm7662@gmail.com</a>
          <a href="https://github.com/Somesh4206" target="_blank" rel="noreferrer" className="contact-link"><span aria-hidden="true">⊹</span> github.com/Somesh4206</a>
          <a href="https://linkedin.com/in/somesh4206" target="_blank" rel="noreferrer" className="contact-link"><span aria-hidden="true">◈</span> linkedin.com/in/somesh4206</a>
          <a href="tel:+917010773465" className="contact-link"><span aria-hidden="true">☎</span> +91 7010773465</a></div></div>
        <div className="reveal"><div className="contact-form" role="form" aria-label="Contact form">
          <div className="form-field"><label htmlFor="cf-name">Your Name</label><input id="cf-name" name="name" placeholder="John Doe" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
          <div className="form-field"><label htmlFor="cf-email">Email Address</label><input id="cf-email" name="email" type="email" placeholder="john@example.com" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/></div>
          <div className="form-field"><label htmlFor="cf-msg">Message</label><textarea id="cf-msg" name="message" placeholder="Tell me about your project..." value={form.message} onChange={e=>setForm(f=>({...f,message:e.target.value}))}/></div>
          <button className="btn-primary" onClick={submit}>{sent?'Message Noted ✓':'Send Message →'}</button>
          <p style={{fontSize:'.75rem',color:'var(--muted)'}}>This demo form confirms locally — email me directly for a reply.</p></div></div></div></div></section>);
    }
    function Footer(){ return (<footer><span className="footer-copy">© 2026 Somesh M · AI/ML Engineer · Karur, Tamil Nadu, India</span><span className="footer-logo">SM</span></footer>); }

    /* ── Case study renderer (shared by SPA view; static pages mirror it) ── */
    function WF({items}){
      const [open,setOpen]=useState(0);
      return (<div className="wf">{items.map((s,i)=>(<React.Fragment key={i}><div className={i===open?'wf-stage open':'wf-stage'}>
        <button className="wf-btn" onClick={()=>setOpen(i===open?-1:i)} aria-expanded={i===open}><span>{String(i+1).padStart(2,'0')} · {s[0]}</span><small>{i===open?'−':'+'}</small></button>
        {i===open && <p className="wf-detail">{s[1]}</p>}</div>{i<items.length-1 && <div className="wf-arrow" aria-hidden="true">↓</div>}</React.Fragment>))}</div>);
    }
    function CasePage({slug}){
      const p=PROJECTS.find(x=>x.slug===slug); const d=DETAILS[slug];
      useEffect(()=>{ document.title=p.seoTitle; const md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content',p.seoDesc); window.scrollTo(0,0); },[slug]);
      if(!p||!d) return (<main id="main" className="case-wrap"><a className="back-link" href="#/">← All projects</a><h1 className="case-title">Not found</h1></main>);
      const idx=PROJECTS.findIndex(x=>x.slug===slug);
      const prev=PROJECTS[(idx+PROJECTS.length-1)%PROJECTS.length], next=PROJECTS[(idx+1)%PROJECTS.length];
      const rel=d.related.map(s=>PROJECTS.find(x=>x.slug===s)).filter(Boolean);
      const goBack=e=>{e.preventDefault(); window.location.hash='#/'; setTimeout(()=>scrollTo('projects'),60);};
      return (<main id="main" className="case-wrap">
        <div className="case-topnav"><a className="back-link" href="#/" onClick={goBack}>← Back to Projects</a><span className="case-num">Project {p.num} / 06 · {p.category}</span></div>
        <p className="case-num">Case Study {p.num}</p>
        <h1 className="case-title">{p.title}</h1>
        <p className="case-tagline">{p.tagline}</p>
        <p className="case-intro">{d.intro}</p>
        <div className="case-meta">{p.tech.map(t=>(<span key={t}>{t}</span>))}</div>
        <div className="case-links"><a className="btn-primary" href={p.github} target="_blank" rel="noopener noreferrer">GitHub Repository</a>
          {p.demo && <a className="btn-outline" href={p.demo} target="_blank" rel="noopener noreferrer">Live Demo</a>}
          <a className="btn-ghost" href={'projects/'+p.slug+'/'} target="_blank" rel="noopener noreferrer">Open printable page</a></div>
        <div className="case-hero-visual" aria-label="Project visual summary"><div className="big">{p.title.toUpperCase()}</div><div className="sub">{p.tagline}</div>
          <div className="flow-mini">{d.workflow.map(w=>w[0]).join('  →  ')}</div></div>

        <div className="case-section"><p className="case-kicker">01 · Overview</p><h2>Over<span className="k">view</span></h2>{d.overview.map((t,i)=>(<p key={i}>{t}</p>))}</div>
        <div className="case-section"><p className="case-kicker">02 · The Problem</p><h2>The <span className="k">Problem</span></h2>{d.problem.map((t,i)=>(<p key={i}>{t}</p>))}</div>
        <div className="case-section"><p className="case-kicker">03 · The Solution</p><h2>The <span className="k">Solution</span></h2>{d.solution.map((t,i)=>(<p key={i}>{t}</p>))}</div>
        <div className="case-section"><p className="case-kicker">04 · How It Works</p><h2>How It <span className="k">Works</span></h2><p>Select a stage to see what happens inside it. Every stage maps to code in the repository.</p><WF items={d.workflow}/></div>
        <div className="case-section"><p className="case-kicker">05 · System Architecture</p><h2>System <span className="k">Architecture</span></h2><div className="arch">{d.arch.map((a,i)=>(<React.Fragment key={i}><div className="arch-box"><b>{a[0]}</b><p>{a[1]}</p></div>{i<d.arch.length-1 && <div className="arch-arrow" aria-hidden="true">↓</div>}</React.Fragment>))}</div></div>
        <div className="case-section"><p className="case-kicker">06 · Core Features</p><h2>Core <span className="k">Features</span></h2>{d.features.map((f,i)=>(<div key={i} className="feat"><h3>{f[0]}</h3><p>{f[1]}</p>{f[2] && <p className="why">Scope note: {f[2]}</p>}</div>))}</div>
        <div className="case-section"><p className="case-kicker">07 · Technical Implementation</p><h2>Technical <span className="k">Implementation</span></h2><ul>{d.impl.map((t,i)=>(<li key={i}>{t}</li>))}</ul>
          {d.deep && d.deep.map((x,i)=>(<div key={i} className="chal"><p><strong>Deep dive — {x[0]}.</strong></p><p>{x[1]}</p></div>))}</div>
        <div className="case-section"><p className="case-kicker">08 · My Contribution</p><h2>My <span className="k">Contribution</span></h2><ul>{d.contrib.map((t,i)=>(<li key={i}>{t}</li>))}</ul></div>
        <div className="case-section"><p className="case-kicker">09 · Tech Stack</p><h2>Tech <span className="k">Stack</span></h2><dl className="stack">{d.stack.map((s,i)=>(<React.Fragment key={i}><dt>{s[0]}</dt><dd>{s[1]}</dd></React.Fragment>))}</dl></div>
        <div className="case-section"><p className="case-kicker">10 · Challenges & Decisions</p><h2>Challenges &amp; <span className="k">Decisions</span></h2>{d.challenges.map((c,i)=>(<div key={i} className="chal"><p>{c[0]}</p></div>))}</div>
        <div className="case-section"><p className="case-kicker">11 · Result</p><h2>Res<span className="k">ult</span></h2><ul>{d.outcome.map((t,i)=>(<li key={i}>{t}</li>))}</ul>
          <div className="chal"><p><strong>Visuals.</strong> {d.visuals}</p></div>
          {d.disclaimer && <p className="disclaimer">⚕ {d.disclaimer}</p>}</div>
        <div className="case-section"><p className="case-kicker">12 · Links</p><h2>GitHub <span className="k">/ Demo</span></h2>
          <div className="case-links"><a className="btn-primary" href={p.github} target="_blank" rel="noopener noreferrer">GitHub Repository</a>{p.demo && <a className="btn-outline" href={p.demo} target="_blank" rel="noopener noreferrer">Live Demo</a>}</div></div>
        <div className="case-section"><p className="case-kicker">13 · Keep Reading</p><h2>Related <span className="k">Projects</span></h2>
          <div className="related-grid">{rel.map(r=>(<a key={r.slug} className="related-card" href={'#/projects/'+r.slug}><b>{r.num} · {r.title}</b><span>{r.tagline}</span></a>))}</div>
          <div className="prevnext"><a className="back-link" href={'#/projects/'+prev.slug}>← {prev.title}</a><a className="back-link" href="#/" onClick={goBack}>All Projects</a><a className="back-link" href={'#/projects/'+next.slug}>{next.title} →</a></div></div>
      </main>);
    }

    function App(){
      const h=useHash(); const parts=parseRoute(h);
      const isDetail=parts[0]==='projects'&&parts[1];
      useReveal(h);
      useEffect(()=>{ if(!isDetail){ document.title='Somesh M | AI/ML Engineer | Project Case Studies'; } },[h,isDetail]);
      return (<React.Fragment><Navbar/>
        {isDetail ? (<CasePage slug={parts[1]}/>) : (
        <main id="main"><Hero/><Marquee/><About/><Skills/><Work/><Projects/><Contact/></main>)}
        <Footer/></React.Fragment>);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
